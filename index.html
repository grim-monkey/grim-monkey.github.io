<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://i.imgur.com/hki6WZI.gif" />
    <meta property="og:image" content="https://i.imgur.com/hki6WZI.gif" />
    <meta property="twitter:card" content="summary_large_image" />
    <title>Grim Monkey</title>

    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet" />

    <style>
      /* === GLOBAL === */
      body {
        background-image: url("assets/images/rockingunderwater.jpeg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: scroll;
        min-height: 100vh;

        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      /* Cursor  */
      * {
        cursor: url(https://cur.cursors-4u.net/symbols/sym-1/sym46.cur), auto !important;
      }

      h1 {
        font-family: "Black Ops One", sans-serif;
        text-align: center;
        margin-top: 0;
      }
      
      /* === CENTER NAV BUTTON === */
      .center-button {
        position: absolute;
       top: 50%;
       left: 50%;
        transform: translate(-50%, -50%);

        padding: 16px 28px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
       text-decoration: none;

        font-size: 20px;
        border: 2px solid white;
        border-radius: 8px;

        transition: all 0.2s ease;
      }

      .center-button:hover {
       background: rgba(10, 10, 10, 0.85); /* near-black charcoal */
       border-color: #1a1a1a;
      }
    </style>

  <body>

<a href="home.html" class="center-button">
  Keep Swimming?
</a>

  </body>
</html>
