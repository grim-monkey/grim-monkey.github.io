<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://i.imgur.com/hki6WZI.gif" />
    <meta property="og:image" content="https://i.imgur.com/hki6WZI.gif" />
    <meta property="twitter:card" content="summary_large_image" />
    <title>Grim Monkey</title>

    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet" />

    <style>
      /* === GLOBAL === */
      body {
        background-image: url("https://grimmonkey.neocities.org/thewaterwaits.png");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        background-attachment: scroll;
        min-height: 100vh;

        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
      }

      /* Cursor  */
      * {
        cursor: url(https://cur.cursors-4u.net/symbols/sym-1/sym46.cur), auto !important;
      }

      h1 {
        font-family: "Black Ops One", sans-serif;
        text-align: center;
        margin-top: 0;
      }
      
     
      /* === HIDDEN CIRCLE PORTAL === */
      .hidden-button {
       position: fixed;

       /* slightly left of center */
       top: 50%;
       left: 48%;
       transform: translate(-50%, -50%);

        width: 70px;
        height: 70px;
        border-radius: 50%;

        background: transparent;
        border: none;
        cursor: pointer;

        transition: box-shadow 0.25s ease, background 0.25s ease;
      }

      /* Soft glow on hover */
      .hidden-button:hover {
        background: radial-gradient(
          circle at center,
          rgba(255,255,255,0.14) 0%,
          rgba(255,255,255,0.06) 45%,
          rgba(255,255,255,0.02) 65%,
          rgba(255,255,255,0) 80%
        );

        box-shadow:
          0 0 22px rgba(255,255,255,0.28),
          0 0 55px rgba(255,255,255,0.18);
      }
      
      </style>
    </head>
  
  <body>
  
    <button
    class="hidden-button"
    onclick="window.location.href='home.html';"
    aria-label="hidden link">
    </button>
  
  </body>
  
</html>
